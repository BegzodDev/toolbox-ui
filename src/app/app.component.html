<div class="shell">
  <app-sidebar />

  <div class="mobile-bar">
    <div class="top-side">
      <div class="name">bekhzod<span>.dev</span></div>

      @if (isMobile()) {
        <app-language-changer />
      }
    </div>
    <nav class="mobile-nav" aria-label="Tool navigation">
      <span class="mobile-nav__prefix"> PG </span>
      <span class="mobile-nav__prompt"> &#10095; </span>
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="mobile-nav__arg"
        >
          {{ item.label | transloco }}
        </a>
      }

      <span class="mobile-nav__cursor"></span>
    </nav>
  </div>

  <header>
    <app-topbar />
  </header>

  <main>
    <router-outlet />
  </main>
</div>
